<div>
<div class="row justify-content-center align-items-center" *ngIf="pwa.showBanner">
    <div class="col-12 col-md-3 align-self-center">
        <div class="alert alert-info pwa-banner mb-3" role="status">
            <p class="mb-2"><strong>GsApp è una PWA.</strong> Puoi installarla sulla schermata Home e usarla come un’app nativa, anche senza aprire il browser.</p>
            <button
                type="button"
                class="btn btn-primary btn-sm w-100 mb-2"
                *ngIf="pwa.canPrompt$ | async"
                (click)="pwa.install()">
                Installa
            </button>
            <p class="mb-0 small" *ngIf="pwa.isIos">Su iPhone o iPad: tocca <strong>Condividi</strong> e poi <strong>Aggiungi alla schermata Home</strong>.</p>
            <p class="mb-0 small" *ngIf="!(pwa.canPrompt$ | async) && !pwa.isIos">Dal menu del browser scegli <strong>Installa app</strong> o <strong>Aggiungi alla schermata Home</strong>.</p>
        </div>
    </div>
</div>
<div class="row justify-content-center align-items-center ">
    <div class="col-12 col-md-3 align-self-center">
        <button type="button" class="btn btn-primary btn-lg w-100 btn-block" routerLink="/lista-uscite" >Uscite future</button>
    </div>
</div>
<div class="row justify-content-center align-items-center " *ngIf="showInsPresenze">
    <div class="col-12 col-md-3 align-self-center">
        <button type="button" class="btn btn-primary btn-lg w-100 btn-block" routerLink="/inserisci-presenze" >Inserisci Presenze</button>
    </div>
</div>
<div class="row justify-content-center align-items-center " *ngIf="showInsPresenze">
    <div class="col-12 col-md-3 align-self-center">
        <button type="button" class="btn btn-primary btn-lg w-100 btn-block" routerLink="/lista-presenze" >Lista Presenze</button>
    </div>
</div>
<div class="row justify-content-center align-items-center " *ngIf="showInsPresenze">
    <div class="col-12 col-md-3 align-self-center">
        <button type="button" class="btn btn-primary btn-lg w-100 btn-block" routerLink="/convocazione" >Convocazione</button>
    </div>
</div>
