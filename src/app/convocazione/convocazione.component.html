<h2>Convocazione</h2>

<mat-form-field *ngIf="needsSelect" class="w-100">
  <mat-label>Seleziona ruolo</mat-label>
  <mat-select [(value)]="selectedRuolo" (selectionChange)="onRuoloChange($event.value)">
    <mat-option *ngFor="let opt of ruoloOptions" [value]="opt.value">{{opt.label}}</mat-option>
  </mat-select>
</mat-form-field>

<div class="d-flex justify-content-center" *ngIf="!showUscite">
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<table mat-table *ngIf="showUscite && (!needsSelect || selectedRuolo)" [dataSource]="uscite" multiTemplateDataRows>
  <ng-container matColumnDef="titolo">
    <th mat-header-cell *matHeaderCellDef>Titolo</th>
    <td mat-cell *matCellDef="let element">{{ element.fields.Titolo }}</td>
  </ng-container>
  <ng-container matColumnDef="luogo">
    <th mat-header-cell *matHeaderCellDef>Luogo</th>
    <td mat-cell *matCellDef="let element">{{ element.fields.Luogo }}</td>
  </ng-container>

  <ng-container matColumnDef="expandedDetail">
    <td mat-cell *matCellDef="let element" [attr.colspan]="displayedColumns.length">
      <div class="example-element-detail" [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
        <div *ngIf="expandedElement === element" class="iscritti-panel">
          <div *ngIf="!(iscrittiByUscita[element.id] && iscrittiByUscita[element.id].length)" class="text-muted mb-2">Nessun iscritto per questo ambito.</div>
          <div *ngFor="let iscritto of iscrittiByUscita[element.id]" class="iscritto-row">
            <mat-checkbox [(ngModel)]="iscritto.selected">{{ iscritto.nome }}</mat-checkbox>
          </div>
          <button
            type="button"
            class="btn btn-primary mt-2"
            [disabled]="saving[element.id] || !(iscrittiByUscita[element.id] && iscrittiByUscita[element.id].length)"
            (click)="salva(element); $event.stopPropagation()"
          >
            Salva
          </button>
        </div>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr
    mat-row
    *matRowDef="let element; columns: displayedColumns"
    class="example-element-row"
    [class.example-expanded-row]="expandedElement === element"
    (click)="toggleExpand(element)"
  ></tr>
  <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
</table>
